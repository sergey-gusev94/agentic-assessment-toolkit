name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install document tools
        # System programs the PDF export and document preflight tests need.
        # Tests skip without them locally; here AAT_FAIL_ON_SKIP turns any
        # skip into a failure, so CI never silently drops that coverage.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc poppler-utils qpdf libreoffice-writer-nogui libreoffice-impress-nogui
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run checks
        env:
          AAT_FAIL_ON_SKIP: "1"
        run: make check
      - name: Build package
        run: make package
