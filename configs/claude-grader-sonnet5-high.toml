# Pinned Claude Code grading configuration (docs/design.md, "Experiment
# configs and config identity"). The frozen judge configuration of
# design decision 8: any edit here, to the grader prompt template, or to
# the selected rubric is a new config identity by construction. Harbor
# strips the provider prefix from the model name into ANTHROPIC_MODEL,
# and maps reasoning_effort to the Claude CLI's --effort flag. The agent
# version is baked into the environment image, not pinned here.
stage = "grade"
agent = "claude-code"
model = "anthropic/claude-sonnet-5"
reasoning_effort = "high"
prompt = "grader"
rubric = "default"
