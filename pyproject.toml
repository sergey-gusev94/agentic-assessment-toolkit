[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-assessment-toolkit"
dynamic = ["version"]
description = "Benchmarking coding agents on coursework and LLM-assisted grading, over Harbor"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Sergey Gusev" },
]
dependencies = [
  "harbor>=0.20,<0.21",
  "numpy>=2.0",
  "pandas>=2.2",
  "pypdf>=5.0",
]

[project.scripts]
aat = "agentic_assessment_toolkit.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pandas-stubs>=2.2",
  "pre-commit>=3.7",
  "pytest>=8",
  "ruff>=0.6",
]

[tool.hatch.version]
path = "src/agentic_assessment_toolkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_assessment_toolkit"]

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/.pre-commit-config.yaml",
  "/AGENTS.md",
  "/LICENSE",
  "/Makefile",
  "/README.md",
  "/configs",
  "/docs",
  "/pyproject.toml",
  "/src",
  "/tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Golden fixtures are byte-exact expected output, not code to restyle.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
  "ARG",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "PTH",
  "SIM",
  "UP",
]
ignore = ["E501"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
warn_return_any = true
warn_unused_ignores = true
# Template scripts (the verifiers and the PDF preflight) are standalone
# scripts that run inside task containers, outside this package; they
# are exercised by tests as subprocesses instead of being type-checked
# as package modules. Golden fixtures contain byte-exact copies of them.
exclude = [
  "src/agentic_assessment_toolkit/templates/",
  "tests/fixtures/",
]
